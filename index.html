<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Odliczanie</title>
  
  <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">

  <style>
    * {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050505;
      color: #ff0000;
      font-family: 'Seven Segment', 'Courier New', monospace;
      overflow: hidden;
    }

    body {
      display: -webkit-box;
      display: -webkit-flex;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      -ms-flex-pack: center;
      justify-content: center;
      -webkit-box-align: center;
      -webkit-align-items: center;
      -ms-flex-align: center;
      align-items: center;
      padding: 5px;
    }

    /* Sztywne wymuszenie jednej linii (white-space: nowrap + flex-wrap: nowrap) */
    .timer-container {
      background: #0a0a0a;
      padding: 15px 10px;
      border-radius: 12px;
      border: 2px solid #111;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      
      display: -webkit-box;
      display: -webkit-flex;
      display: -ms-flexbox;
      display: flex;
      
      -webkit-box-orient: horizontal;
      -webkit-box-direction: normal;
      -webkit-flex-direction: row;
      -ms-flex-direction: row;
      flex-direction: row;
      
      -webkit-flex-wrap: nowrap;
      -ms-flex-wrap: nowrap;
      flex-wrap: nowrap;
      
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      -ms-flex-pack: center;
      justify-content: center;
      
      -webkit-box-align: center;
      -webkit-align-items: center;
      -ms-flex-align: center;
      align-items: center;
      
      width: 98vw;
      max-width: 900px;
      white-space: nowrap;
    }

    /* Przeliczone jednostki VW, aby 4 bloki + 3 dwukropki idealnie mieściły się w 100% szerokości ekranu */
    .display {
      position: relative;
      background: #110000;
      padding: 5px 0;
      border-radius: 6px;
      font-size: 8.5vw;
      text-align: center;
      color: #ff0000;
      text-shadow: 0 0 8px #ff0000;
      border: 1px solid #330000;
      
      -webkit-box-flex: 1;
      -webkit-flex: 1 1 auto;
      -ms-flex: 1 1 auto;
      flex: 1 1 auto;
      
      margin: 0 2px;
    }

    @media (min-width: 900px) {
      .display {
        font-size: 75px;
      }
      .colon {
        font-size: 65px;
      }
    }

    /* Wygaszone tło cyfr */
    .display::before {
      content: "888";
      position: absolute;
      left: 0;
      right: 0;
      top: 5px;
      opacity: 0.05;
      color: #ff0000;
      pointer-events: none;
    }

    .display.short::before {
      content: "88";
    }

    .colon {
      font-size: 7.5vw;
      color: #ff0000;
      text-shadow: 0 0 8px #ff0000;
      -webkit-animation: blink 1s infinite;
      animation: blink 1s infinite;
      line-height: 1;
      padding: 0 1px;
      
      -webkit-box-flex: 0;
      -webkit-flex: 0 0 auto;
      -ms-flex: 0 0 auto;
      flex: 0 0 auto;
    }

    @-webkit-keyframes blink {
      50% { opacity: 0.2; }
    }
    @keyframes blink {
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>

  <div class="timer-container">
    <div class="display" id="days">000</div>
    <div class="colon">:</div>
    <div class="display short" id="hours">00</div>
    <div class="colon">:</div>
    <div class="display short" id="minutes">00</div>
    <div class="colon">:</div>
    <div class="display short" id="seconds">00</div>
  </div>

  <script>
    var targetDate = new Date('December 15, 2026 00:00:00').getTime();

    function padZero(num, size) {
      var s = num + "";
      while (s.length < size) s = "0" + s;
      return s;
    }

    function updateCountdown() {
      var now = new Date().getTime();
      var difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById('days').innerHTML = "000";
        document.getElementById('hours').innerHTML = "00";
        document.getElementById('minutes').innerHTML = "00";
        document.getElementById('seconds').innerHTML = "00";
        return;
      }

      var days = Math.floor(difference / (1000 * 60 * 60 * 24));
      var hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = padZero(days, 3);
      document.getElementById('hours').textContent = padZero(hours, 2);
      document.getElementById('minutes').textContent = padZero(minutes, 2);
      document.getElementById('seconds').textContent = padZero(seconds, 2);
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
