<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odliczanie</title>
  
  <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      color: #ff0000;
      font-family: 'Seven Segment', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    /* Zewnętrzny kontener skalujący */
    .timer-wrapper {
      width: 100%;
      max-width: 900px;
      container-type: inline-size;
    }

    /* Obudowa zegara LED - sztywne zachowanie jednej linii */
    .timer-container {
      background: #0a0a0a;
      padding: 3cqw 4cqw;
      border-radius: 15px;
      border: 2px solid #111;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 1.5cqw;
      width: 100%;
    }

    /* Wyświetlacz reagujący rozmiarem na szerokość kontenera */
    .display {
      position: relative;
      background: #110000;
      padding: 1cqw 1.5cqw;
      border-radius: 8px;
      font-size: 8cqw;
      letter-spacing: 0.2cqw;
      text-align: center;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
      border: 1px solid #330000;
      flex: 1 1 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tło z wygaszonych segmentów LED */
    .display::before {
      content: "888";
      position: absolute;
      opacity: 0.05;
      color: #ff0000;
      pointer-events: none;
    }

    /* Wyjątek dla jednostek z 2 cyframi */
    .display.short::before {
      content: "88";
    }

    .colon {
      font-size: 7cqw;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000;
      animation: blink 1s infinite;
      line-height: 1;
      flex: 0 0 auto;
    }

    @keyframes blink {
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>

  <div class="timer-wrapper">
    <div class="timer-container">
      <div class="display" id="days">000</div>
      <div class="colon">:</div>
      <div class="display short" id="hours">00</div>
      <div class="colon">:</div>
      <div class="display short" id="minutes">00</div>
      <div class="colon">:</div>
      <div class="display short" id="seconds">00</div>
    </div>
  </div>

  <script>
    const targetDate = new Date('December 15, 2026 00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.querySelector('.timer-container').innerHTML = 
          '<div class="display" style="width:100%">00:00:00:00</div>';
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(3, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
